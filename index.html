<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Bootstrap</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="main.css" />
    </head>
    <body data-bs-theme="light">
        <div class="container mt-3">
            <div class="row">
                <div id="theme-container" class="col-4 offset-8 mb-4">
                    <span id="theme" class="material-symbols-outlined">
                        dark_mode
                    </span>
                </div>
            </div>
            <form id="form-contact" class="row">
                <div class="col-12 col-md-6 col-xxl-3 form-floating mb-3">
                    <input
                        class="form-control"
                        type="text"
                        id="name"
                        placeholder="Seu nome"
                        required
                        minlength="3"
                        name="name"
                    />
                    <label for="name">Nome:</label>
                </div>

                <div class="col-12 col-md-6 col-xxl-3 form-floating mb-3">
                    <input
                        class="form-control"
                        type="email"
                        id="email"
                        placeholder="email@email.com"
                        required
                        name="email"
                    />
                    <label class="form-label" for="email">E-mail:</label>
                </div>

                <div class="col-12 col-md-6 col-xxl-3 form-floating mb-3">
                    <input
                        class="form-control"
                        type="tel"
                        id="cellphone"
                        placeholder="(00) 00000-0000"
                        required
                        name="cellphone"
                    />
                    <label class="form-label" for="cellphone">Telefone:</label>
                </div>

                <div
                    id="btn-submit-contact"
                    class="col-12 col-md-6 col-xxl-3 mb-3"
                >
                    <button class="btn btn-success" type="submit">
                        Enviar
                    </button>
                </div>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
        <script
            src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"
        ></script>
        <script src="plugins/jquery.mask.min.js"></script>
        <script src="plugins/jquery.validate.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
