<!DOCTYPE html>
<html lang="pt_BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header class="navbar navbar-expand-lg sticky-top p-4">
      <div class="container">
        <h1 class="navbar-brand m-0">Nome do restaurante</h1>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#menu-navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <nav
          class="navbar-collapse collapse justify-content-end"
          id="menu-navigation"
        >
          <ul class="nav nav-pills d-block d-md-flex">
            <li class="nav-item fw-bold">
              <a href="" class="nav-link active">
                <i class="bi bi-house-door me-1"></i>
                Sobre o restaurante</a
              >
            </li>
            <li class="nav-item fw-bold">
              <a href="" class="nav-link"
                ><i class="bi bi-calendar-check me-1"></i>Eventos</a
              >
            </li>
            <li class="nav-item fw-bold">
              <a href="" class="nav-link"
                ><i class="bi bi-card-text me-1"></i>Nosso cardápio</a
              >
            </li>
            <li class="nav-item fw-bold">
              <a href="" class="nav-link"
                ><i class="bi bi-chat-dots me-1"></i>Fale conosco</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <section id="about">
      <div class="carousel slide" data-bs-ride="carousel" id="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img
              src="images/slides/slide1.png"
              alt="Interior de bar rústico com paredes de tijolos, móveis de madeira e iluminação aconchegante"
            />
          </div>
          <div class="carousel-item">
            <img
              src="images/slides/slide2.png"
              alt="Duas taças de vinho tinto em frente à lareira, com garrafa de Allesverloren Shiraz 2013 ao lado"
            />
          </div>
          <div class="carousel-item">
            <img
              src="images/slides/slide3.png"
              alt="Pratos típicos servidos em tigelas tradicionais de cobre e pedra sobre superfície de madeira"
            />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carousel"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carousel"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon"></span>
        </button>
        <div class="carousel-indicators">
          <button
            class="active"
            type="button"
            data-bs-target="#carousel"
            data-bs-slide-to="0"
          ></button
          ><button
            type="button"
            data-bs-target="#carousel"
            data-bs-slide-to="1"
          ></button
          ><button
            type="button"
            data-bs-target="#carousel"
            data-bs-slide-to="2"
          ></button>
        </div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
